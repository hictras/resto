<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Table...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl space-y-4">
        <div class="text-4xl animate-bounce">🔄</div>
        <h2 class="text-lg font-bold text-amber-400">Securely Connecting...</h2>
        <p class="text-xs text-gray-400">Verifying your table session QR code.</p>
    </div>

    <script>
        function decodeParam(encodedText) {
            try {
                let rev = String(encodedText).split('').reverse().join('');
                while (rev.length % 4 !== 0) { rev += '='; }
                return atob(rev);
            } catch (e) { return null; }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c =>
                ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function showError(message) {
            document.body.innerHTML = `
                <div class="bg-gray-800 border border-red-500/50 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl space-y-3">
                    <div class="text-4xl">⚠️</div>
                    <h2 class="text-lg font-bold text-red-400">Error Page</h2>
                    <p class="text-xs text-gray-300">${escapeHtml(message)}</p>
                </div>`;
        }

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawTbl = urlParams.get('tbl');
            const rawRst = urlParams.get('rst');
            const lifetimeParam = urlParams.get('lifetime') || '15';
            const isPreview = urlParams.get('preview') === '1';

            if (!rawTbl || !rawRst) {
                showError('Please scan the official QR code located on your table.');
                return;
            }

            const currentTable = decodeParam(rawTbl);
            const currentRestaurant = decodeParam(rawRst);
            if (!currentTable || !currentRestaurant) {
                showError('Invalid QR code format.');
                return;
            }

            // ============ PREVIEW MODE ============
            // Admin is peeking at the customer view — no session is created,
            // no device is registered, no guest counter is affected.
            if (isPreview) {
                const previewUrl = `/menu.html?preview=1`
                    + `&rst=${encodeURIComponent(currentRestaurant)}`
                    + `&tbl=${encodeURIComponent(currentTable)}`;
                window.location.replace(previewUrl);
                return;
            }

            // ============ NORMAL CUSTOMER FLOW ============
            try {
                const res = await fetch('/api/create-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        restaurant: currentRestaurant,
                        tableNumber: currentTable,
                        lifetime: parseInt(lifetimeParam) || 15
                    })
                });
                const data = await res.json();

                if (data.success && data.token) {
                    localStorage.setItem(`restaurant_session_token_${data.token}`, Date.now());
                    localStorage.setItem(`restaurant_session_expires_${data.token}`, data.expiresAt);
                    window.location.replace(`/menu.html?token=${encodeURIComponent(data.token)}`);
                } else {
                    throw new Error(data.message || 'Failed to create session');
                }
            } catch (e) {
                showError('Failed to establish a secure table session. ' + (e.message || ''));
            }
        };
    </script>
</body>
</html>
